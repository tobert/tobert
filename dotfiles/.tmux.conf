# Modern tmux configuration inspired by screen workflow
# Minimal keybindings, vim-style navigation

# Clear all default keybindings first
unbind -a

# Set prefix to Control-a (like screen)
set -g prefix C-a
unbind C-b
bind C-a last-window
bind a send-prefix

# Terminal capabilities (tmux 3.2+ terminal-features, replaces terminal-overrides)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -as terminal-features ",xterm*:extkeys"

# Extended keys (CSI u) so modified keys like Shift+Enter reach apps such as Claude Code
set -s extended-keys on

# Let apps (and copy mode) set the system clipboard via OSC 52
set -s set-clipboard on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when closing
set -g renumber-windows on

# History buffer size
set -g history-limit 50000

# No delay for escape key press
set -sg escape-time 0

# Pass focus in/out events to apps (nvim autoread, etc.)
set -g focus-events on

# Mouse on so the wheel scrolls history (copy mode) or reaches apps that want it
# instead of kitty turning it into arrow keys on tmux's alternate screen.
set -g mouse on

# Enable terminal title updates
set -g set-titles on
set -g set-titles-string "#{pane_current_path} - #T"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Arrow key pane navigation (fallback)
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# Direct window access with numbers (like screen)
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind 0 select-window -t 10

# Window navigation (vim-style and arrows)
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-Left previous-window
bind -n M-Right next-window

# Window list (like screen's "Control-a ")
bind '"' choose-window

# Split panes with | and - in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind %

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"


# Keep essential bindings
bind c new-window -c "#{pane_current_path}"
bind d detach-client
bind A command-prompt -I "#W" "rename-window '%%'"
bind n next-window
bind p previous-window
bind q kill-pane
bind Q kill-window
bind C-z suspend-client

# Status line configuration
set -g status on
set -g status-position bottom
set -g status-justify left

# Status line colors (Tokyo Night, matches wezterm tab bar)
set -g status-style bg=#24283b,fg=#787c99

# Left status: session name
set -g status-left-length 20
set -g status-left '[#S] '

# Right status: pwd, pane title, date/time
set -g status-right-length 120
set -g status-right '#{pane_current_path} | #{?#{!=:#T,},#T | ,}%Y-%m-%d %H:%M'

# Window status format
setw -g window-status-format ' #I #W '
setw -g window-status-current-format ' #I #W '
setw -g window-status-current-style bg=#7aa2f7,fg=#1a1b26,bold
setw -g window-status-style fg=#787c99

# Pane border colors
set -g pane-border-style fg=#24283b
set -g pane-active-border-style fg=#7aa2f7

# Message colors
set -g message-style bg=#7aa2f7,fg=#1a1b26

# Copy mode (vim-style). y copies to the clipboard via OSC 52, so it reaches
# wezterm locally and the client terminal over SSH.
setw -g mode-keys vi
bind [ copy-mode
bind ] paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Auto-detach like screen
set -g detach-on-destroy off

# Bell/notification settings (like screen's vbell off)
set -g visual-bell off
set -g bell-action none
