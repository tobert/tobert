# Foot terminal - Amy's Theme

[main]
font=JetBrains Mono:size=16
pad=8x8
# Start the shell as a login shell so ~/.bash_profile runs (it sources ~/.bashrc)
login-shell=yes

[colors-dark]
# Amy's Theme (Tokyo Night based)
background=1a1b26
foreground=e5e5e5

# Standard colors
regular0=15161e  # black
regular1=f7768e  # red
regular2=9ece6a  # green
regular3=e0af68  # yellow
regular4=7aa2f7  # blue
regular5=bb9af7  # magenta
regular6=7dcfff  # cyan
regular7=e5e5e5  # white

# Bright colors
bright0=414868   # bright black
bright1=ff7a93   # bright red
bright2=b9f27c   # bright green
bright3=ffc777   # bright yellow
bright4=82aaff   # bright blue
bright5=c099ff   # bright magenta
bright6=b4f9f8   # bright cyan
bright7=f5f5f5   # bright white
cursor=1a1b26 e5e5e5

