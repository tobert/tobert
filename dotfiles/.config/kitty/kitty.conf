# kitty configuration
# Mirrors the wezterm setup: Amy's Theme (Tokyo Night), CaskaydiaCove NF, 8px padding.
# Keep ctrl+a free for the tmux prefix; kitty defaults use ctrl+shift for its own keys.

# ===========================
# Font
# ===========================
font_family      CaskaydiaCove NF Light
bold_font        CaskaydiaCove NF
italic_font      auto
bold_italic_font auto
font_size        14.0

# Ligatures (wezterm had calt/clig/liga on)
disable_ligatures never

# ===========================
# Window
# ===========================
initial_window_width  120c
initial_window_height 30c
window_padding_width  8
remember_window_size  yes
confirm_os_window_close 0
hide_window_decorations no
window_border_width   0

# ===========================
# Cursor
# ===========================
cursor_shape          block
cursor_blink_interval 0.75
cursor_stop_blinking_after 0

# ===========================
# Scrollback and bell
# ===========================
scrollback_lines 10000
enable_audio_bell no
visual_bell_duration 0.0

# ===========================
# Tab bar: hidden. tmux windows are the tabs, so a second bar is redundant.
# To bring kitty's bar back: tab_bar_style powerline, tab_bar_min_tabs 1.
# ===========================
tab_bar_style hidden

# ===========================
# Mouse and selection
# ===========================
# Mouse stays usable for selection and links, but nothing is sent to apps
# unless they request it. Keep copy-on-select off; use tmux copy mode for
# clipboard work.
copy_on_select no
mouse_hide_wait 3.0
detect_urls yes
url_style curly

# ===========================
# Clipboard
# ===========================
# OSC 52 writes from tmux/apps reach the system clipboard; reads are asked first.
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# ===========================
# Wayland (labwc)
# ===========================
# kitty uses native Wayland on labwc. If the title bar doubles up, try
# hide_window_decorations yes.

# ===========================
# Shell integration
# ===========================
shell_integration enabled

# ===========================
# Colors: Amy's Theme (matches wezterm)
# ===========================
foreground              #e5e5e5
background              #1a1b26
cursor                  #e5e5e5
cursor_text_color       #1a1b26
selection_foreground    #e5e5e5
selection_background    #33467c

# ANSI standard
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #e5e5e5

# ANSI bright
color8  #414868
color9  #ff7a93
color10 #b9f27c
color11 #ffc777
color12 #82aaff
color13 #c099ff
color14 #b4f9f8
color15 #f5f5f5

# Tab bar
active_tab_foreground     #e5e5e5
active_tab_background     #1a1b26
inactive_tab_foreground   #787c99
inactive_tab_background   #24283b
tab_bar_background        #16161e
active_border_color       #7aa2f7
inactive_border_color     #24283b
bell_border_color         #ffc777

# ===========================
# Keyboard
# ===========================
# Let tmux see ctrl+a and friends; kitty's own shortcuts stay on ctrl+shift.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
map ctrl+shift+f5 load_config_file
